# Installed as /etc/ssh/sshd_config.d/10-astra-queue.conf (root, 0644).
# The 10- prefix matters: for most sshd keywords the first value read wins, and
# drop-ins are read in name order before the rest of sshd_config.
# See docs/ASTRUM_ACCESO_POR_USUARIO.md.

# Keys only over the network. The astrum password still works at the physical
# console and for sudo.
PasswordAuthentication no

# Service/admin account: keys live in a root-owned file, so neither a job
# (which runs as astrum) nor anyone else can add one.
Match User astrum
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u

# Collaborators: their own key, and only the job manager.
Match Group astra-queue
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand /usr/local/sbin/astra-queue-gate
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
